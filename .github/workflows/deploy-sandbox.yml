name: Deploy Sandbox

on:
  push:
    branches:
      - sandbox
      - develop
  pull_request:
    branches:
      - sandbox
      - develop

jobs:
  deploy:
    name: Build & Deploy to Sandbox
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # src/ui/clock-faces is the private TIME.clockFaces repo: GITHUB_TOKEN cannot
          # read it, so this needs a GH_PAT secret (as APK.audio's ci.yml uses)
          token: ${{ secrets.GH_PAT || github.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: pip install paho-mqtt

      - name: Typecheck and Test
        run: |
          npm run typecheck
          npm run test -- --run
          npm run test:deploy

      - name: Execute Sandbox Deploy
        # Every deploy setting is a secret mapped to the environment, which
        # SETUP/deploy/env.py reads (no .env is written, none is tracked).
        # Unset TWIST_MQTT_HOST skips the build stamp; unset SPOG_BROKER /
        # SPOG_BUS_KEY ship the default spog-config.js (same-origin /mqtt, plaintext).
        env:
          FTP_HOST: ${{ secrets.SANDBOX_FTP_HOST }}
          FTP_USER: ${{ secrets.SANDBOX_FTP_USER }}
          FTP_PASS: ${{ secrets.SANDBOX_FTP_PASS }}
          FTP_PORT: ${{ secrets.SANDBOX_FTP_PORT }}
          TWIST_MQTT_HOST: ${{ secrets.TWIST_MQTT_HOST }}
          TWIST_MQTT_PORT: ${{ secrets.TWIST_MQTT_PORT }}
          TWIST_MQTT_USER: ${{ secrets.TWIST_MQTT_USER }}
          TWIST_MQTT_PASS: ${{ secrets.TWIST_MQTT_PASS }}
          SPOG_BROKER: ${{ secrets.SPOG_BROKER }}
          SPOG_BUS_KEY: ${{ secrets.SPOG_BUS_KEY }}
          DEPLOY_DIFF_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          DEPLOY_DIFF_HEAD: ${{ github.sha }}
        run: |
          # Incremental: upload ONLY the Routes files changed in this push/PR (the app
          # bundle is always rebuilt + re-uploaded), so the deploy log shows the
          # changes, not the whole tree. Use `deploy.py --all` for a full re-sync.
          python3 SETUP/deploy.py
