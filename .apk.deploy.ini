# Part of the APK.audio project — http://APK.audio — made by Anthony Kuzub
# How this site ships. Read by .apk.scripts/deploy_all.py in the APK.audio checkout:
# `steps` run here in order (any failure stops this site), then `local_dir` is
# mirrored to `server_dir` over FTPS — or `command` uploads instead. `env` maps
# names this site expects to slots in ~/.apk.secrets.env (never committed).
# This replaced the GitHub Actions workflow on 2026-10-31.
# SETUP/deploy.py is SPOG's own uploader and reads SETUP/.env itself; the env
# lines only override it when the envelope has the slot filled. Production only:
# the sandbox workflow deployed another branch and is not part of deploy-all.
[deploy]
site = spog.like.audio
steps =
    npm ci
    npm run typecheck
    npm run test -- --run
    npm run test:deploy
command = python3 SETUP/deploy.py
env =
    FTP_HOST = SPOG_FTP_HOST
    FTP_USER = SPOG_FTP_USER
    FTP_PASS = SPOG_FTP_PASS
    FTP_PORT = SPOG_FTP_PORT
    TWIST_MQTT_HOST = SPOG_TWIST_MQTT_HOST
    TWIST_MQTT_PORT = SPOG_TWIST_MQTT_PORT
    TWIST_MQTT_USER = SPOG_TWIST_MQTT_USER
    TWIST_MQTT_PASS = SPOG_TWIST_MQTT_PASS
    SPOG_BROKER = SPOG_BROKER
    SPOG_BUS_KEY = SPOG_BUS_KEY
